name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: yum install -y createrepo git rpm-sign pinentry

      - run: bin/build-rpm-repo.sh
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_NAME: ${{ secrets.GPG_KEY_NAME }}

      - run: find docs

      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: ./docs/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
